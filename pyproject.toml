[project]
name = "project-memory"
version = "0.1.0"
description = "Claude Code Skill: 跨会话项目级记忆系统，基于 zvec 向量库"
readme = "SKILL.md"
requires-python = ">=3.10"
dependencies = [
    "zvec>=0.1.0",
    "sentence-transformers>=3.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
project-memory = "project_memory.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_memory"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]
